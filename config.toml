parallel-jobs = 1

# Pikos .mpp enthält eigene Extensions. Das optionale Umschreiben der
# ReVanced-Integrationsprüfungen schlägt hier nur unnötig fehl.
remove-rv-integrations-checks = false

# ============================================================
# Stable automatisch:
# - neuester stabiler Piko-Release
# - automatisch die neueste von den Patches unterstützte Instagram-Version
# - Stock-APK über Uptodown statt APKMirror (vermeidet HTTP 403)
# ============================================================

[Instagram-Piko]
enabled = true
app-name = "Instagram-Piko"
build-mode = "apk"

patches-source = "crimera/piko"
patches-version = "latest"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
rv-brand = "Piko"

pkg-name = "com.instagram.android"
version = "auto"
arch = "arm64-v8a"
dpi = "120-640dpi"

uptodown-dlurl = "https://instagram.en.uptodown.com/android"


[Instagram1-Piko]
enabled = true
app-name = "Instagram1-Piko"
build-mode = "apk"

patches-source = "crimera/piko"
patches-version = "latest"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
rv-brand = "Piko"

# Quellpaket bleibt Instagram; der Clone-Patch ändert die fertige APK.
pkg-name = "com.instagram.android"
version = "auto"
arch = "arm64-v8a"
dpi = "120-640dpi"

uptodown-dlurl = "https://instagram.en.uptodown.com/android"

included-patches = "'Clone'"
patcher-args = """\
  -OpackageName=com.instagram1.android \
  -OappName=Instagram1 \
  """
