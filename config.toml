parallel-jobs = 1

# ============================================================
# Automatisch aktualisierter Stable-Build
# Piko: jeweils neuester stabiler Release
# Instagram: automatisch neueste dazu kompatible Version
# ============================================================

# 1) Reguläres Instagram
# Paket: com.instagram.android
[Instagram-Piko]
enabled = true
app-name = "Instagram-Piko"
build-mode = "apk"

patches-source = "crimera/piko"
patches-version = "latest"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
rv-brand = "Piko"

pkg-name = "com.instagram.android"
version = "auto"
arch = "arm64-v8a"
dpi = "120-640dpi"

apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"


# 2) Separat installierbarer Klon
# Paket nach dem Patch: com.instagram1.android
[Instagram1-Piko]
enabled = true
app-name = "Instagram1-Piko"
build-mode = "apk"

patches-source = "crimera/piko"
patches-version = "latest"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
rv-brand = "Piko"

# Quellpaket bleibt das originale Instagram-Paket.
pkg-name = "com.instagram.android"
version = "auto"
arch = "arm64-v8a"
dpi = "120-640dpi"

apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"

# Pikos eigener Clone-Patch.
included-patches = "'Clone'"
patcher-args = """\
  -OpackageName=com.instagram1.android \
  -OappName=Instagram1 \
  """
